<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOPX Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f9;color:#182238;font-family:system-ui,"Noto Sans Bengali",sans-serif}.wrap{max-width:1000px;margin:30px auto;padding:16px}.card{background:white;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 8px 24px #1a29420b}h1{margin-top:0}.muted{color:#718096;font-size:13px}.field{display:grid;gap:6px;margin:12px 0}.field input{padding:12px;border:1px solid #dce3ed;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 15px;background:#06ad91;color:white;font-weight:700;cursor:pointer;margin:3px}.reject{background:#ffe8e9;color:#b42331}.approve{background:#e5f8ef;color:#087c4b}.item{border:1px solid #e8edf3;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.tag{background:#fff2d6;color:#8a6100;border-radius:20px;padding:4px 10px;font-size:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #edf0f4;font-size:14px}
</style></head><body><div class="wrap">
<section class="card" id="login"><h1>SHOPX Admin Login</h1><p class="muted">ডেমো অ্যাডমিন: admin@shopx.local / ShopxDemo123</p><form id="loginForm"><div class="field"><label>ইমেইল</label><input id="email" type="email" required value="admin@shopx.local"></div><div class="field"><label>পাসওয়ার্ড</label><input id="password" type="password" required value="ShopxDemo123"></div><button class="btn">লগইন</button></form></section>
<section class="hidden" id="dashboard"><div class="card"><div class="row"><h1>Admin Dashboard</h1><button class="btn reject" onclick="logout()">লগআউট</button></div><div class="row"><div><b id="total">0</b><div class="muted">মোট আবেদন</div></div><div><b id="pending">0</b><div class="muted">Pending</div></div><div><b id="approved">0</b><div class="muted">Approved</div></div></div></div>
<div class="card"><h2>Seller Applications</h2><div id="list"></div></div></section></div>
<script>
const $=id=>document.getElementById(id);const ADMIN='admin@shopx.local',PASS='ShopxDemo123';
$('loginForm').addEventListener('submit',e=>{e.preventDefault();if($('email').value===ADMIN&&$('password').value===PASS){sessionStorage.setItem('shopx_admin','yes');render()}else alert('ভুল লগইন তথ্য')});
function render(){let ok=sessionStorage.getItem('shopx_admin')==='yes';$('login').classList.toggle('hidden',ok);$('dashboard').classList.toggle('hidden',!ok);if(!ok)return;let arr=JSON.parse(localStorage.getItem('shopx_submissions')||'[]');$('total').textContent=arr.length;$('pending').textContent=arr.filter(x=>x.status==='Pending').length;$('approved').textContent=arr.filter(x=>x.status==='Approved').length;$('list').innerHTML=arr.length?arr.map(x=>`<div class="item"><div class="row"><b>${esc(x.type)}</b><span class="tag">${esc(x.status)}</span></div><p>Seller: ${esc(x.email)} | মূল্য: ৳${x.price}</p><p>যোগাযোগ: ${esc(x.contact)}</p><p>${esc(x.details)}</p><small>${esc(x.date)}</small><div><button class="btn approve" onclick="setStatus(${x.id},'Approved')">Approve</button><button class="btn reject" onclick="setStatus(${x.id},'Rejected')">Reject</button></div></div>`).join(''):'কোনো আবেদন নেই।'}
function setStatus(id,status){let a=JSON.parse(localStorage.getItem('shopx_submissions')||'[]');a=a.map(x=>x.id===id?{...x,status}:x);localStorage.setItem('shopx_submissions',JSON.stringify(a));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logout(){sessionStorage.removeItem('shopx_admin');render()}render();
</script></body></html>
